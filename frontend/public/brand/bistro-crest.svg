<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="crestGold" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5D061"/>
      <stop offset="50%" stop-color="#D49B5B"/>
      <stop offset="100%" stop-color="#C47A59"/>
    </linearGradient>
    <linearGradient id="crestSage" x1="30" y1="20" x2="70" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7EA98B"/>
      <stop offset="100%" stop-color="#46624F"/>
    </linearGradient>
    <radialGradient id="crestGlow" cx="50" cy="50" r="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF5E8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FAF5E8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="50" cy="50" r="46" fill="url(#crestGlow)"/>

  <!-- Outer Geometric Ring -->
  <circle cx="50" cy="50" r="44" stroke="url(#crestGold)" stroke-width="1.8" stroke-dasharray="2 2" opacity="0.6"/>
  <circle cx="50" cy="50" r="40" stroke="url(#crestSage)" stroke-width="2"/>

  <!-- AI Compass Star Elements (4 Cardinal Points) -->
  <path d="M50 14 L52 20 L50 22 L48 20 Z" fill="url(#crestGold)"/>
  <path d="M50 86 L52 80 L50 78 L48 80 Z" fill="url(#crestGold)"/>
  <path d="M14 50 L20 48 L22 50 L20 52 Z" fill="url(#crestGold)"/>
  <path d="M86 50 L80 48 L78 50 L80 52 Z" fill="url(#crestGold)"/>

  <!-- Intertwined Sage Leaves (Left & Right Wreath) -->
  <g fill="url(#crestSage)">
    <!-- Left Leaf -->
    <path d="M50 72 C42 68 34 58 35 46 C41 48 47 56 50 72 Z"/>
    <!-- Left Small Accent Leaf -->
    <path d="M41 53 C34 49 32 40 35 34 C38 38 41 45 41 53 Z" opacity="0.9"/>
    <!-- Right Leaf -->
    <path d="M50 72 C58 68 66 58 65 46 C59 48 53 56 50 72 Z"/>
    <!-- Right Small Accent Leaf -->
    <path d="M59 53 C66 49 68 40 65 34 C62 38 59 45 59 53 Z" opacity="0.9"/>
  </g>

  <!-- Saffron Flower Petals & Stigma (Centerpiece) -->
  <!-- Back Petals -->
  <path d="M50 48 C44 40 43 28 50 22 C57 28 56 40 50 48 Z" fill="url(#crestGold)"/>
  <!-- Left Petal -->
  <path d="M48 50 C41 44 38 32 45 27 C49 33 50 42 48 50 Z" fill="#E28743" opacity="0.95"/>
  <!-- Right Petal -->
  <path d="M52 50 C59 44 62 32 55 27 C51 33 50 42 52 50 Z" fill="#E28743" opacity="0.95"/>

  <!-- Saffron Stigma (Three Crimson/Gold Filaments) -->
  <path d="M50 44 C49 36 44 32 44 28" stroke="#C44536" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M50 44 C50 34 50 30 50 25" stroke="#D9534F" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M50 44 C51 36 56 32 56 28" stroke="#C44536" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Center Table Node Point (AI Matrix Core) -->
  <circle cx="50" cy="50" r="3.2" fill="url(#crestGold)"/>
  <circle cx="50" cy="50" r="1.5" fill="#FFFFFF"/>

  <!-- Base Stem Accent -->
  <path d="M50 72 L50 82" stroke="url(#crestSage)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
