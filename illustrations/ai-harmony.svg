<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="harmSage" x1="10" y1="10" x2="70" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7EA98B"/>
      <stop offset="100%" stop-color="#46624F"/>
    </linearGradient>
    <linearGradient id="harmGold" x1="20" y1="10" x2="60" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5D061"/>
      <stop offset="100%" stop-color="#C47A59"/>
