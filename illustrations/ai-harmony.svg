  </defs>
  <!-- Background Pill -->
  <rect width="80" height="80" rx="22" fill="#F0F7F2" fill-opacity="0.9"/>
  
  <!-- Harmonized Table Fit with AI Path Connection -->
  <rect x="18" y="26" width="22" height="18" rx="5" stroke="#55745E" stroke-width="1.8" fill="#FFFFFF"/>
  <rect x="42" y="38" width="22" height="18" rx="5" stroke="#55745E" stroke-width="1.8" fill="#FFFFFF"/>
  <!-- Connecting AI Golden Spline -->
  <path d="M29 35 Q40 22 53 47" stroke="url(#harmGold)" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 2"/>

